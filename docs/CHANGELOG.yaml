- version: '0.1.2'
  date: '2026-08-19'
  author: 'Scott Chrestman'
  changes:
    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Optimized NetBox tenant resolution by implementing ID caching to reduce redundant API calls.'
    - category: '🐛 Bug Fixes & Resilience'
      items:
        - 'Implemented automatic retry logic to resolve site and cluster assignment conflicts during VM synchronization.'
        - 'Added support for NetBox instances that enforce tenant group requirements via a new configurable tenant group setting.'


- version: '0.1.1'
  date: '2026-08-19'
  author: 'Scott Chrestman'
  changes:
    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Implemented Redis-backed state management and caching with support for ACL users, database indexing, and atomic pipelines.'
        - 'Developed a FastAPI lifespan handler to manage application startup, shutdown, and asynchronous background workers for synchronization and promotion.'
        - 'Established a GitLab CI/CD pipeline using Kaniko for linux/amd64 container builds and integration with the GitLab Container Registry.'
        - 'Updated application network port and Uvicorn server configuration to port 8020.'
        - 'Implemented an atomic snapshot mechanism to preserve the last-known-good state of the data store during synchronization failures.'
    - category: '✨ New Features & Enhancements'
      items:
        - 'Integrated dual NetBox support for reading managed-device lists from a GT-T instance and writing mirrored hosts to a Customer instance.'
        - 'Developed a host mirroring service featuring SHA1 fingerprinting for idempotency, polymorphic support for devices and VMs, and a soft-delete lifecycle.'
        - 'Implemented an automated host discovery and promotion pipeline based on configurable sighting thresholds, observation durations, and creation limits.'
        - 'Introduced an Inventory API with endpoints for telemetry ingestion (/sightings), managed host retrieval (/managed), and system status.'
        - 'Added GraphQL API integration (CMD) utilizing OAuth2 authentication for segment-to-site lookups.'
        - 'Implemented IP-to-site resolution logic using longest-prefix match and RFC1918 private IPv4 address validation.'
        - 'Introduced Pydantic schemas for telemetry sighting data validation and serialization.'
    - category: '🐛 Bug Fixes & Resilience'
      items:
        - 'Enhanced NetBox API client with support for pagination, TLS-terminating proxy URL rebasing, and configurable SSL verification.'
        - 'Implemented graceful shutdown logic for background tasks using asyncio task cancellation and gathering.'
        - 'Added granular error handling to synchronization and promotion cycles to ensure individual host failures do not terminate the process.'
        - 'Implemented a startup retry strategy to ensure the data store is fully populated before the application enters steady-state.'
    - category: '🔒 Security & Auth'
      items:
        - 'Added support for Redis username and password authentication via ACLs.'
        - 'Implemented OAuth2 authentication for the CMD GraphQL API integration.'
    - category: '🧹 Refactoring & Chores'
      items:
        - 'Introduced strict YAML and Markdown linting configurations to enforce coding and documentation standards.'
        - 'Integrated static code analysis using the PMD Copy-Paste Detector (CPD).'
        - 'Established a comprehensive testing framework using pytest, pytest-asyncio, respx for HTTP mocking, and fakeredis for Redis mocking.'
        - 'Implemented a normalization layer to standardize NetBox devices and virtual machines into a common internal host format.'
        - 'Added a version cleaning utility to normalize placeholder strings for improved CVE scanning accuracy.'


