- version: '0.1.9'
  date: '2026-09-24'
  author: 'Franklin Zhang'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Added support for latitude and longitude coordinates in site creation, updates, and retrieval.'
        - 'Implemented site discovery and option listing in the inventory API to support frontend selection.'
        - 'Automated the application of halo-site and halo-managed tags during GTT site upserts.'
