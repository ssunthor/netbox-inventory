- version: '0.1.8'
  date: '2026-09-24'
  author: 'Scott Chrestman'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Implemented automatic derivation of network prefixes from managed hosts to ensure accurate site resolution on the Destinations map, particularly for public-addressed sites.'
        - 'Refined the site discovery logic to catalog all customer DCIM sites while utilizing the GT-T NetBox exclusively for data enrichment.'
    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Introduced a priority-based prefix merging system that ensures IPAM data takes precedence over host-derived networks and maintains longest-prefix-first sorting for lookups.'


- version: '0.1.7'
  date: '2026-09-23'
  author: 'Franklin Zhang'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Implemented automated mirroring of GTT-derived sites to NetBox, including support for physical address backfilling.'
        - 'Introduced site tagging logic to distinguish between halo-managed and customer-created sites within NetBox.'


- version: '0.1.6'
  date: '2026-09-23'
  author: 'Franklin Zhang'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Introduced new inventory API endpoints to retrieve device roles, manufacturers, platforms, and device types.'
        - 'Added site management capabilities, including the ability to list, create, and update sites with physical address support.'
        - 'Implemented a GNID-based location lookup mechanism via a two-step GraphQL query process.'
        - 'Added discovered IP mapping to the managed payload to enable precise reconciliation of auto-promoted devices.'
    - category: '🐛 Bug Fixes & Resilience'
      items:
        - 'Enhanced NetBox API resilience by implementing specific error mapping and race condition handling during site creation.'
        - 'Fixed a logic error in CMD custom field parsing by switching from segment ID to GNID extraction.'
        - 'Updated site address formatting to correctly map fields from the client site data structure.'
    - category: '🧹 Refactoring & Chores'
      items:
        - 'Streamlined GraphQL client interactions by introducing a centralized execution helper.'
        - 'Updated internal location caching to utilize GNID as the primary identifier.'


- version: '0.1.5'
  date: '2026-09-22'
  author: 'Franklin Zhang'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Implemented new API endpoints for managing NetBox inventory, enabling the creation and modification of hosts, sites, and network prefixes.'
        - 'Added the ability to update metadata for discovered hosts, including name, role, and site assignments.'
        - 'Enhanced host data models to support platform and OS versioning for improved asset visibility.'
    - category: '🧹 Refactoring & Chores'
      items:
        - 'Expanded test coverage for inventory management and NetBox write services to ensure API reliability.'


- version: '0.1.4'
  date: '2026-09-10'
  author: 'Scott Chrestman'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Implemented bulk host import functionality via CSV, including NetBox device creation and local registry tracking.'
        - 'Added manual network location assignment, allowing users to override subnet-to-site mappings.'
        - 'Introduced per-host CVE monitoring controls via a synchronized NetBox custom field.'
        - 'Added automated site geocoding using Nominatim to enable coordinate-based map plotting for sites.'
        - 'Implemented the ability to delete telemetry-discovered hosts from both NetBox and local tracking.'
    - category: '🐛 Bug Fixes & Resilience'
      items:
        - 'Improved IP address discovery by switching to ID-based filtering, resolving issues where untenanted interface IPs were omitted.'
    - category: '🧹 Refactoring & Chores'
      items:
        - 'Standardized string slugification across the inventory service.'


- version: '0.1.3'
